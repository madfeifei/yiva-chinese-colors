name: Secret scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Patterns (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for secret patterns
        run: |
          curl -sSL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --log-opts="--all" --redact --no-banner --exit-code 1

  trufflehog:
    name: Validity (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify any credential found against its provider
        run: |
          curl -sSL -o th.tar.gz \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.100.1/trufflehog_3.100.1_linux_amd64.tar.gz
          tar -xzf th.tar.gz trufflehog
          ./trufflehog git "file://$GITHUB_WORKSPACE" --only-verified --no-update --fail
